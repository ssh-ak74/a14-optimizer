syntax = "proto3";

package a14.telemetry.v1;

service TelemetryAnalysis {
  rpc StreamTelemetry(stream TelemetryFrame) returns (stream AnalysisResponse);
}

message TelemetryFrame {
  string machine_id = 1;
  int64 unix_ms = 2;
  double cpu_total_percent = 3;
  repeated double cpu_per_core_percent = 4;
  double ram_used_gb = 5;
  double ram_total_gb = 6;
  double disk_queue_depth = 7;
  double disk_latency_ms = 8;
  repeated ProcessSample processes = 9;
}

message ProcessSample {
  int32 pid = 1;
  string name = 2;
  double cpu_percent = 3;
  double ram_mb = 4;
  double disk_read_kbps = 5;
  double disk_write_kbps = 6;
}

message AnalysisResponse {
  int32 health_score = 1;
  repeated Bottleneck bottlenecks = 2;
  repeated Recommendation recommendations = 3;
  string model_version = 4;
}

message Bottleneck {
  string type = 1;
  string target = 2;
  int32 severity = 3;
  string explanation = 4;
}

message Recommendation {
  string id = 1;
  string action = 2;
  int32 estimated_impact = 3;
  int32 risk_score = 4;
  bool requires_confirmation = 5;
}
